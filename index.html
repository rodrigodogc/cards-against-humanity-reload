<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#121214" />

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Cartas Contra a Humanidade em português</title>

  <meta name="description" content="Jogo de cartas online em português, com humor adulto, para jogar com os amigos (não oficial).">
  <meta name="robots" content="noindex">

  <meta property="og:title" content="Cartas Contra a Humanidade em português" />
  <meta property="og:description" content="Jogo de cartas online em português, com humor adulto, para jogar com os amigos (não oficial)." />
  <meta property="og:image" content="/cover.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Aplica o tema antes do primeiro desenho, para não piscar. As chaves são as de hooks/useAppTheme. -->
  <script>
    (function () {
      try {
        var root = document.documentElement;
        var mode = localStorage.getItem('chakra-ui-color-mode') || 'system';
        var palette = JSON.parse(localStorage.getItem('@CARDS_AGAINST_HUMANITY/PALETTE') || '"classic"');

        if (mode === 'system') {
          mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        root.dataset.theme = mode;
        root.style.colorScheme = mode;
        root.dataset.palette = palette;
      } catch (error) {
        // Sem localStorage, vale o tema padrão.
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
